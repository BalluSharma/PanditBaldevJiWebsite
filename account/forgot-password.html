<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Pandit Baldev Sharma</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%89%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="account.css">
</head>
<body>
<div id="loader"><div class="loader-om">ॐ</div></div>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <div class="brand-mark">ॐ</div>
      <div class="brand-text"><div class="name">Pandit Baldev Sharma</div><div class="tag"><span class="lang-en">Karmakandi Pandit</span><span class="lang-hi">कर्मकांडी पंडित</span></div></div>
    </a>
    <div class="nav-actions">
      <button class="mini-btn" id="langToggle" style="font-size:13px;">🌐 <span class="lang-en">हिंदी</span><span class="lang-hi">English</span></button>
      <button class="icon-toggle" id="darkToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="icon-badge">🔑</div>
    <h1><span class="lang-en">Reset Password</span><span class="lang-hi">पासवर्ड रीसेट करें</span></h1>
    <p class="sub"><span class="lang-en">Enter your account email — we'll send a secure reset link.</span><span class="lang-hi">अपनी खाता ईमेल डालें — हम एक सुरक्षित रीसेट लिंक भेजेंगे।</span></p>

    <div class="auth-msg" id="authMsg"></div>

    <form id="forgotForm">
      <div class="form-group">
        <label><span class="lang-en">Email</span><span class="lang-hi">ईमेल</span></label>
        <input type="email" name="email" required placeholder="you@email.com">
      </div>
      <button type="submit" class="btn btn-primary"><span class="lang-en">Send Reset Link</span><span class="lang-hi">रीसेट लिंक भेजें</span></button>
    </form>

    <p class="auth-switch"><a href="login.html">← <span class="lang-en">Back to Login</span><span class="lang-hi">लॉगिन पर वापस जाएं</span></a></p>
    <p class="auth-note"><a href="../index.html"><span class="lang-en">Back to Home</span><span class="lang-hi">होम पर वापस जाएं</span></a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="account.js"></script>
<script>
const htmlRoot = document.getElementById('htmlRoot');
document.getElementById('langToggle').addEventListener('click', ()=>{
  htmlRoot.setAttribute('lang', htmlRoot.getAttribute('lang')==='hi' ? 'en' : 'hi');
});
</script>
</body>
</html>
